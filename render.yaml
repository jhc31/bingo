# Render Blueprint: New > Blueprint > pick this repo.
# DATABASE_URL = Supabase "Session pooler" connection string (IPv4), entered when prompted.
services:
  - type: web
    name: bingo-lab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # Every 5 minutes, 3 minutes after each draw (the API publishes 1-2 min late), 07:08-23:58 Taipei (UTC+8 -> 23:xx, 00-15 UTC).
  # Cron Jobs are a paid Render service. For a free setup, delete this block and use
  # supabase/cron_free_option.sql instead.
  - type: cron
    name: bingo-sync
    runtime: python
    plan: starter
    region: singapore
    schedule: "3-59/5 0-15,23 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.sync
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        sync: false
