# Render Blueprint: New > Blueprint > pick this repo.
# DATABASE_URL = Supabase "Session pooler" connection string (IPv4), entered when prompted.
#
# Free setup: only the web service. Draws are synced by the app's built-in scheduler while
# it is awake, and Supabase pg_cron (supabase/cron_free_option.sql) calls /api/cron/sync
# every 5 minutes so the service keeps syncing even when idle.
services:
  - type: web
    name: bingo-lab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
